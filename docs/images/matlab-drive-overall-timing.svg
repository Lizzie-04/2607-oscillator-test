<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">N等于1500、样点周期0.5毫秒时的完整芯片驱动时序</title>
  <desc id="desc">完整波形持续750毫秒。串行移位从0.5毫秒开始到474.5毫秒结束，使能脉冲位于475到475.5毫秒，复位和两个启动信号在479毫秒升高，复位持续0.5毫秒，启动信号保持到750毫秒。</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 20px Arial, "Microsoft YaHei", sans-serif; fill: #334155; }
      .label { font: 600 16px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1.1; stroke-dasharray: 5 5; }
      .clk { stroke: #2563eb; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
      .data { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .enable { stroke: #d97706; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
      .reset { stroke: #dc2626; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
      .start { stroke: #059669; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
      .phase-serial { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .phase-start { fill: #d1fae5; stroke: #059669; stroke-width: 1.5; }
      .phase-short { fill: #ffedd5; stroke: #d97706; stroke-width: 1.5; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="840"/>
  <text class="title" x="800" y="45" text-anchor="middle">完整驱动周期：Ts = 0.5 ms，N = 1500，总时长 = 750 ms</text>

  <text class="subtitle" x="70" y="92">阶段总览（短脉冲宽度为便于观察而放大）</text>
  <g transform="translate(90,115)">
    <rect class="phase-short" x="0" y="0" width="86" height="74" rx="6"/>
    <text class="label" x="43" y="28" text-anchor="middle">初始空闲</text>
    <text class="small" x="43" y="52" text-anchor="middle">0–0.5 ms</text>

    <rect class="phase-serial" x="90" y="0" width="690" height="74" rx="6"/>
    <text class="label" x="435" y="28" text-anchor="middle">474位串行移位：每位1 ms，共474 ms</text>
    <text class="small" x="435" y="52" text-anchor="middle">0.5–474.5 ms；上升沿位于1–474 ms</text>

    <rect class="phase-short" x="784" y="0" width="100" height="74" rx="6"/>
    <text class="label" x="834" y="26" text-anchor="middle">后置空闲</text>
    <text class="small" x="834" y="50" text-anchor="middle">0.5 ms</text>

    <rect class="phase-short" x="888" y="0" width="100" height="74" rx="6"/>
    <text class="label" x="938" y="26" text-anchor="middle">En脉冲</text>
    <text class="small" x="938" y="50" text-anchor="middle">0.5 ms</text>

    <rect class="phase-short" x="992" y="0" width="116" height="74" rx="6"/>
    <text class="label" x="1050" y="26" text-anchor="middle">保护间隔</text>
    <text class="small" x="1050" y="50" text-anchor="middle">3.5 ms</text>

    <rect class="phase-start" x="1112" y="0" width="330" height="74" rx="6"/>
    <text class="label" x="1277" y="28" text-anchor="middle">START_DLL/ANA保持高</text>
    <text class="small" x="1277" y="52" text-anchor="middle">479–750 ms，共271 ms</text>
  </g>

  <rect class="note" x="90" y="215" width="1440" height="78" rx="8"/>
  <text class="label" x="118" y="246">关键绝对时刻：</text>
  <text class="small" x="270" y="246">d1上升沿 1 ms；BYPASS上升沿 474 ms；En上升 475 ms；Reset与两个START上升 479 ms；波形结束 750 ms。</text>
  <text class="small" x="118" y="272">CLOCK_50等效计数：0.5 ms = 25,000周期，1 ms = 50,000周期，整轮 = 37,500,000周期。</text>

  <text class="subtitle" x="70" y="342">尾部精确时序（每格0.5 ms，对应一个MATLAB/DAQ样点）</text>
  <g transform="translate(0,0)">
    <g class="grid">
      <line x1="250" y1="375" x2="250" y2="730"/>
      <line x1="335" y1="375" x2="335" y2="730"/>
      <line x1="420" y1="375" x2="420" y2="730"/>
      <line x1="505" y1="375" x2="505" y2="730"/>
      <line x1="590" y1="375" x2="590" y2="730"/>
      <line x1="675" y1="375" x2="675" y2="730"/>
      <line x1="760" y1="375" x2="760" y2="730"/>
      <line x1="845" y1="375" x2="845" y2="730"/>
      <line x1="930" y1="375" x2="930" y2="730"/>
      <line x1="1015" y1="375" x2="1015" y2="730"/>
      <line x1="1100" y1="375" x2="1100" y2="730"/>
      <line x1="1185" y1="375" x2="1185" y2="730"/>
      <line x1="1270" y1="375" x2="1270" y2="730"/>
      <line x1="1355" y1="375" x2="1355" y2="730"/>
      <line x1="1440" y1="375" x2="1440" y2="730"/>
    </g>
    <g class="small" text-anchor="middle">
      <text x="292.5" y="367">473.5</text>
      <text x="377.5" y="367">474.0</text>
      <text x="462.5" y="367">474.5</text>
      <text x="547.5" y="367">475.0</text>
      <text x="632.5" y="367">475.5</text>
      <text x="717.5" y="367">476.0</text>
      <text x="802.5" y="367">476.5</text>
      <text x="887.5" y="367">477.0</text>
      <text x="972.5" y="367">477.5</text>
      <text x="1057.5" y="367">478.0</text>
      <text x="1142.5" y="367">478.5</text>
      <text x="1227.5" y="367">479.0</text>
      <text x="1312.5" y="367">479.5</text>
      <text x="1397.5" y="367">480.0 ms</text>
    </g>

    <g class="label" text-anchor="end">
      <text x="220" y="432">Din</text>
      <text x="220" y="502">CLK_SHReg</text>
      <text x="220" y="572">En[4:0]</text>
      <text x="220" y="642">Reset</text>
      <text x="220" y="712">START_DLL/ANA</text>
    </g>

    <rect class="data" x="250" y="396" width="170" height="52" rx="5"/>
    <text class="label" x="335" y="428" text-anchor="middle">d474 = BYPASS</text>
    <text class="small" x="505" y="428">随后Din回到0</text>

    <path class="clk" d="M250 518 L335 518 L335 474 L420 474 L420 518 L1440 518"/>
    <text class="small" x="377.5" y="466" text-anchor="middle">第474个高半拍</text>

    <path class="enable" d="M250 588 L505 588 L505 544 L590 544 L590 588 L1440 588"/>
    <text class="small" x="547.5" y="538" text-anchor="middle">En高0.5 ms</text>

    <path class="reset" d="M250 658 L1185 658 L1185 614 L1270 614 L1270 658 L1440 658"/>
    <text class="small" x="1227.5" y="608" text-anchor="middle">Reset高0.5 ms</text>

    <path class="start" d="M250 728 L1185 728 L1185 684 L1440 684"/>
    <text class="small" x="1312.5" y="678" text-anchor="middle">START从479 ms起保持为1</text>
  </g>

  <text class="small" x="90" y="785">注：样点n的输出时刻按 t(n) = (n−1)×0.5 ms 计算；上图尾部对应样点948至961附近。</text>
  <text class="small" x="90" y="812">MATLAB只规定到第1500个样点的缓冲区内容；DAQ任务结束后是否保持最后电平由DAQ配置决定，FPGA重构时必须显式定义。</text>
</svg>
